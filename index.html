<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧健身課表與計時器</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        button, select, input, a { cursor: pointer; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- 頂部導覽列 -->
    <header class="bg-[#1e293b] border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-dumbbell text-sky-400 text-xl"></i>
                <h1 class="text-sm font-bold tracking-wide">智慧健身課表與計時器</h1>
            </div>
            <div class="flex space-x-1">
                <button type="button" id="tab-gen" class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-sky-400 text-slate-950 transition">單日排課</button>
                <button type="button" id="tab-week" class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">一週總覽</button>
                <button type="button" id="tab-cust" class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">自排</button>
                <button type="button" id="tab-hist" class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">紀錄</button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-md mx-auto px-4 py-4 space-y-4">

        <!-- 今日快捷啟動橫幅 -->
        <div class="bg-gradient-to-r from-sky-900 to-slate-900 border border-sky-700 rounded-2xl p-4 shadow-lg flex justify-between items-center">
            <div>
                <div class="text-[10px] text-sky-400 font-bold uppercase tracking-wider" id="today-date-text">今天是 星期幾</div>
                <h3 class="text-sm font-bold text-white" id="today-plan-label">載入中...</h3>
            </div>
            <button type="button" id="btn-launch-today" class="bg-sky-400 hover:bg-sky-300 text-slate-950 font-bold px-3 py-2 rounded-xl text-xs transition shadow flex items-center space-x-1">
                <i class="fa-solid fa-play"></i>
                <span>開始今日課表</span>
            </button>
        </div>

        <!-- 畫面 1：單日排課與產生器 -->
        <div id="view-generator" class="space-y-4">
            <div id="setup-card" class="bg-[#1e293b] rounded-2xl p-5 shadow-lg border border-slate-800 space-y-4">
                <h2 class="text-base font-semibold text-sky-400 flex items-center space-x-2">
                    <i class="fa-solid fa-sliders"></i>
                    <span>個人數據、訓練目標與部位設定</span>
                </h2>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">身高 (cm)</label>
                        <input type="number" id="input-height" value="174" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-400">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">體重 (kg)</label>
                        <input type="number" id="input-weight" value="115" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-400">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">年齡</label>
                        <input type="number" id="input-age" value="30" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-400">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">生理性別</label>
                        <select id="input-gender" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-400">
                            <option value="male">男性</option>
                            <option value="female">女性</option>
                        </select>
                    </div>
                </div>

                <div class="bg-slate-900 rounded-xl p-3 border border-slate-800 text-xs flex justify-around text-center">
                    <div><span class="text-slate-400 block">BMI</span><span id="val-bmi" class="font-bold text-sky-400 text-sm">-</span></div>
                    <div class="border-r border-slate-800"></div>
                    <div><span class="text-slate-400 block">基礎代謝 BMR</span><span id="val-bmr" class="font-bold text-slate-200 text-sm">- kcal</span></div>
                    <div class="border-r border-slate-800"></div>
                    <div><span class="text-slate-400 block">每日總消耗 TDEE</span><span id="val-tdee" class="font-bold text-slate-200 text-sm">- kcal</span></div>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">訓練核心目標</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" id="goal-hyp" class="py-2.5 rounded-xl text-xs font-bold border border-sky-400 bg-sky-400/20 text-sky-400 transition">💪 增肌肥大</button>
                        <button type="button" id="goal-fat" class="py-2.5 rounded-xl text-xs font-bold border border-slate-700 bg-slate-900 text-slate-400 transition">🔥 減脂雕塑</button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">選擇訓練部位主題</label>
                    <select id="input-split" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-400">
                        <option value="chest">🔥 胸部訓練日 (30選4)</option>
                        <option value="back">🦍 背部訓練日 (30選4)</option>
                        <option value="legs">🦵 腿部訓練日 (30選4)</option>
                        <option value="shoulders">🦾 肩部訓練日 (30選4)</option>
                        <option value="biceps">💪 二頭肌專項 (30選4)</option>
                        <option value="triceps">🦾 三頭肌專項 (30選4)</option>
                        <option value="abs">⚡ 腹肌核心 (30選4)</option>
                        <option value="stretching">🧘 伸展恢復 (20種)</option>
                        <option value="fullbody">⚡ 全身綜合循環</option>
                    </select>
                </div>

                <button type="button" id="btn-generate" class="w-full bg-sky-400 hover:bg-sky-300 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg mt-2 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>立即生成專屬課表</span>
                </button>
            </div>

            <!-- 生成後的動作清單檢視 -->
            <div id="workout-container" class="hidden space-y-4">
                <div class="bg-[#1e293b] rounded-2xl p-4 border border-slate-800 flex justify-between items-center">
                    <div>
                        <h3 id="plan-title" class="font-bold text-base text-sky-400">今日訓練課表</h3>
                        <p class="text-xs text-slate-400 mt-0.5">精選 4 項高效率動作（可點擊「更換」替換動作）</p>
                    </div>
                    <button type="button" id="btn-reset" class="bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 px-3 py-1.5 rounded-lg transition">重設</button>
                </div>

                <div id="exercise-list" class="space-y-3"></div>

                <div class="flex space-x-2">
                    <button type="button" id="btn-back-setup" class="flex-1 bg-slate-800 text-slate-200 font-bold py-3 rounded-xl text-sm">返回設定</button>
                    <button type="button" id="btn-start-session" class="flex-[2] bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl text-sm">開始計時</button>
                </div>
            </div>
        </div>

        <!-- 畫面 2：一週排程總覽 -->
        <div id="view-weekly" class="hidden space-y-4">
            <div class="bg-[#1e293b] rounded-2xl p-5 shadow-lg border border-slate-800 space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-base font-semibold text-sky-400">一週訓練排程總覽</h2>
                    <button type="button" id="btn-save-weekly" class="bg-sky-400 text-slate-950 text-xs px-3 py-1.5 rounded-lg font-bold">儲存排程</button>
                </div>
                <div id="weekly-schedule-list" class="space-y-3"></div>
            </div>
        </div>

        <!-- 畫面 3：自排課表 -->
        <div id="view-custom" class="hidden space-y-6">
            <div class="bg-[#1e293b] rounded-2xl p-5 shadow-lg border border-slate-800 space-y-4">
                <h2 class="text-base font-semibold text-sky-400">自訂專屬訓練課表</h2>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">選擇肌群部位</label>
                    <select id="cust-cat" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                        <option value="chest">胸部 (30種)</option>
                        <option value="back">背部 (30種)</option>
                        <option value="legs">腿部 (30種)</option>
                        <option value="shoulders">肩部 (30種)</option>
                        <option value="biceps">二頭肌 (30種)</option>
                        <option value="triceps">三頭肌 (30種)</option>
                        <option value="abs">腹部核心 (30種)</option>
                        <option value="stretching">伸展放鬆 (20種)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">選擇具體動作</label>
                    <select id="cust-ex" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"></select>
                </div>
                <button type="button" id="btn-add-cust" class="w-full bg-slate-800 text-sky-400 font-bold py-2.5 rounded-xl text-xs border border-slate-700">加入自訂清單 (限4種)</button>
                
                <div class="border-t border-slate-800 pt-3 space-y-2">
                    <h4 class="text-xs font-semibold text-slate-400">目前自訂動作清單 (<span id="cust-count">0</span>/4)</h4>
                    <div id="cust-list" class="space-y-2 max-h-48 overflow-y-auto">
                        <p class="text-xs text-slate-500 text-center py-4">尚未新增動作</p>
                    </div>
                </div>

                <button type="button" id="btn-start-cust" disabled class="w-full bg-slate-800 text-slate-500 font-bold py-3 rounded-xl text-sm cursor-not-allowed">開始自訂課表計時</button>
            </div>
        </div>

        <!-- 畫面 4：歷史紀錄 -->
        <div id="view-history" class="hidden space-y-4">
            <div class="bg-[#1e293b] rounded-2xl p-4 border border-slate-800 space-y-3">
                <h2 class="text-base font-semibold text-sky-400">歷史訓練紀錄</h2>
                <div id="history-list" class="space-y-3"></div>
            </div>
        </div>

        <!-- 獨立共用的計時器互動模式畫面 -->
        <div id="view-session" class="hidden bg-[#1e293b] rounded-2xl p-5 border border-slate-800 text-center space-y-6">
            <div class="flex justify-between items-center text-xs text-slate-400">
                <span id="session-progress-text">動作 1 / 4</span>
                <button type="button" id="btn-quit" class="text-rose-400 hover:underline">放棄訓練</button>
            </div>

            <div class="w-full p-4 bg-slate-900 rounded-xl border border-slate-800 flex flex-col items-center space-y-2">
                <i class="fa-brands fa-youtube text-rose-500 text-3xl"></i>
                <p class="text-xs text-slate-300">觀看 YouTube 標準動作教學</p>
                <a id="active-yt-link" href="#" target="_blank" class="bg-rose-600 text-white font-bold px-4 py-2 rounded-xl text-xs shadow-md">YouTube 影片示範</a>
            </div>

            <div class="space-y-2">
                <h2 id="active-ex-name" class="text-2xl font-black text-sky-400">動作名稱</h2>
                <p id="active-ex-target" class="text-xs text-slate-400 bg-slate-900 inline-block px-3 py-1 rounded-full">目標：主肌群</p>
            </div>

            <div class="bg-slate-900 rounded-2xl p-6 border border-slate-800">
                <div id="timer-label" class="text-xs text-slate-400 uppercase tracking-widest mb-1">訓練進行中</div>
                <div id="timer-display" class="text-6xl font-black text-white my-2">00:45</div>
                <div id="timer-sets-info" class="text-sm font-medium text-sky-400">第 1 組 / 共 3 組</div>
            </div>

            <div class="flex space-x-3">
                <button type="button" id="btn-pause" class="flex-1 bg-slate-800 font-bold py-3 rounded-xl text-sm">暫停</button>
                <button type="button" id="btn-skip" class="flex-1 bg-sky-400 text-slate-950 font-bold py-3 rounded-xl text-sm">完成此組/跳過休息</button>
            </div>
        </div>

    </main>

    <!-- 動作解析 Modal -->
    <div id="modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#1e293b] border border-slate-700 w-full max-w-sm rounded-2xl p-5 space-y-4 relative">
            <button type="button" id="modal-close" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 id="modal-title" class="text-xl font-bold text-white">動作名稱</h3>
            <a id="modal-yt" href="#" target="_blank" class="block bg-rose-600 text-center text-white font-bold py-2.5 rounded-xl text-xs">YouTube 影片教學</a>
            <p id="modal-steps" class="text-xs text-slate-300 bg-slate-900 p-3 rounded-xl">-</p>
            <p id="modal-tips" class="text-xs text-emerald-400 bg-slate-900 p-3 rounded-xl">-</p>
        </div>
    </div>

    <!-- 核心 JavaScript 邏輯 -->
    <script>
        const db = {
            chest: [
                { name: '槓片式上斜推胸機', target: '上胸肌', steps: '將槓片裝載至機器兩側，背部緊貼椅凳，發力向前推舉。', tips: '推起時吐氣，感受上胸收縮。' },
                { name: '槓片式平胸推機', target: '胸大肌整體', steps: '裝載槓片後握住水平把手，向前推展。', tips: '沉肩挺胸，切勿聳肩。' },
                { name: '槓片式下斜推胸機', target: '胸大肌下緣', steps: '坐於下斜槓片機向前下方推舉。', tips: '針對胸肌下束輪廓。' },
                { name: '史密斯上斜臥推', target: '上胸肌、三頭肌', steps: '調整上斜椅至30-45度，雙手握住史密斯槓鈴推起。', tips: '手肘保持微曲不鎖死。' },
                { name: '史密斯平凳臥推', target: '胸大肌整體力量', steps: '於史密斯架平凳上進行槓鈴臥推。', tips: '軌道固定安全。' },
                { name: '史密斯下斜臥推', target: '胸大肌下束', steps: '於下斜凳史密斯架上進行臥推。', tips: '強力刺激胸肌下緣。' },
                { name: '滑輪夾胸 (Cable Crossover)', target: '胸大肌內側', steps: '雙手握住高位滑輪把手向前下方夾緊。', tips: '頂峰收縮1秒。' },
                { name: '坐姿胸推機', target: '胸大肌整體', steps: '坐在器械上推動把手向前伸展。', tips: '沉肩發力。' },
                { name: '蝴蝶機夾胸 (Pec Deck)', target: '胸大肌中縫', steps: '前臂緊貼靠墊向中央合攏。', tips: '感受深刻擠壓。' },
                { name: '自由槓鈴臥推', target: '胸大肌力量', steps: '仰臥平凳握槓下放至胸口推起。', tips: '注意保護架安全。' },
                { name: '槓鈴上斜臥推', target: '上胸肌肥大', steps: '上斜凳上進行自由槓鈴臥推。', tips: '打造飽滿上胸。' },
                { name: '槓鈴下斜臥推', target: '胸大肌下緣', steps: '下斜凳上進行槓鈴臥推。', tips: '強調下胸厚度。' },
                { name: '雙槓臂屈伸 (Dips)', target: '胸肌下緣', steps: '雙杠支撐身體前傾屈肘下放再推起。', tips: '身體前傾強化胸肌。' },
                { name: '低位滑輪夾胸', target: '上胸肌雕塑', steps: '由低位滑輪向上斜上方夾胸。', tips: '塑造飽滿上胸。' },
                { name: '單臂坐姿胸推機', target: '單側胸肌孤立', steps: '使用單側胸推機輪流推舉。', tips: '矯正左右肌力差。' },
                { name: '高位滑輪夾胸', target: '胸大肌下部', steps: '由高位滑輪向下斜向夾胸。', tips: '收緊下胸輪廓。' },
                { name: '槓片式坐姿飛鳥機', target: '胸大肌外側', steps: '坐在槓片飛鳥機上夾胸。', tips: '維持全程穩定張力。' },
                { name: '啞鈴上斜臥推', target: '上胸肌', steps: '躺在30度上斜凳持啞鈴推舉。', tips: '動作幅度更大。' },
                { name: '啞鈴平凳臥推', target: '胸大肌平衡', steps: '平凳啞鈴臥推。', tips: '鍛鍊穩定度。' },
                { name: '啞鈴上斜飛鳥', target: '上胸外側', steps: '上斜凳上持啞鈴做開合飛鳥。', tips: '感受極致拉伸。' },
                { name: '壺鈴地心引力胸推', target: '壺鈴胸肌', steps: '手持壺鈴進行臥推。', tips: '刺激深層纖維。' },
                { name: '慢速離心胸推機', target: '胸肌肌肥大', steps: '胸推機推回過程放慢至4秒。', tips: '最大化肌肥大。' },
                { name: '坐姿斜向推胸機', target: '多角度胸肌', steps: '調整器械角度推胸。', tips: '全方位刺激。' },
                { name: '輔助雙槓臂屈伸機', target: '胸肌輔助', steps: '膝蓋跪在輔助墊上雙槓下壓。', tips: '適合初中級。' },
                { name: '單臂滑輪夾胸', target: '單側胸肌中縫', steps: '單手抓滑輪向對側夾緊。', tips: '極致收縮。' },
                { name: '水平滑輪推胸', target: '抗旋胸推', steps: '站立面對滑輪向前推舉。', tips: '結合核心。' },
                { name: '槓鈴廣角臥推', target: '胸大肌外側', steps: '較寬握距平凳臥推。', tips: '加強外側伸展。' },
                { name: '器械平胸夾胸結合機', target: '推夾綜合', steps: '結合推舉與夾胸軌道。', tips: '全面轟炸。' },
                { name: '啞鈴下斜臥推', target: '胸肌下束', steps: '下斜凳啞鈴臥推。', tips: '強調下胸輪廓。' },
                { name: '超級組滑輪夾胸', target: '胸肌極限充血', steps: '高低位滑輪夾胸連做。', tips: '達到訓練巔峰。' }
            ],
            back: [
                { name: '槓片式斜板划船機', target: '中背肌、厚度', steps: '胸部緊貼靠墊向後拉動把手。', tips: '夾緊肩胛骨。' },
                { name: '槓片式高位下拉機', target: '背闊肌', steps: '雙手握住獨立把手下拉至胸口。', tips: '左右獨立發力。' },
                { name: '槓片式水平划船機', target: '背部厚度', steps: '坐在機台前胸貼靠墊向後拉。', tips: '肘尖貼近身體。' },
                { name: '滑輪下拉 (Lat Pulldown)', target: '背闊肌、上背', steps: '寬握把手拉向鎖骨下方。', tips: '挺胸沉肩。' },
                { name: '坐姿纜繩划船', target: '中背肌、菱形肌', steps: '坐在滑輪機前將把手拉向腹部。', tips: '收緊肩胛骨。' },

                { name: '棒式核心支撐', target: '深層核心', steps: '前臂與腳尖撐地呈一直線。', tips: '切勿塌腰。' },
                { name: '抗力球捲腹', target: '核心穩定', steps: '背躺抗力球上做捲腹。', tips: '強化深層核心。' },
                { name: '船式靜態支撐', target: '腹橫肌', steps: '坐姿後仰與雙腿離地呈V字。', tips: '呼吸平穩。' },
                { name: '器械腹部捲腹機', target: '專項抗阻', steps: '坐捲腹機向前推動靠墊。', tips: '抗阻力訓練。' },
                { name: '滑輪側向屈體', target: '強力腹斜肌', steps: '側向拉動滑輪砍木動作。', tips: '鍛鍊側腹。' },
                { name: 'Ab Wheel 腹肌輪', target: '核心極限', steps: '跪地持腹肌輪向前推展。', tips: '腰椎絕對不可塌。' }
            ],
            stretching: [
                { name: '坐姿前彎腿後側伸展', target: '大腿後側', steps: '雙腿伸直身體前傾抓腳尖。', tips: '由髖部帶動前傾。' },
                { name: '貓牛式伸展', target: '脊椎靈活度', steps: '四足跪姿拱背與塌腰交替。', tips: '配合呼吸。' },
                { name: '胸大肌門框伸展', target: '胸肌釋放', steps: '手肘貼門框身體向前跨出。', tips: '改善圓肩。' },
                { name: '嬰兒式放鬆', target: '下背部放鬆', steps: '跪坐於腳跟上向前伸展。', tips: '深呼吸釋放壓力。' },
                { name: '鴿子式臀部伸展', target: '臀大肌深層', steps: '單腿向前屈膝橫放壓髖。', tips: '釋放臀部緊繃。' },
                { name: '四頭肌站姿伸展', target: '大腿前側', steps: '單腳站立後拉腳踝貼臀。', tips: '膝蓋併攏直立。' },
                { name: '下犬式伸展', target: '後側鏈與小腿', steps: '手腳撐地臀部向上推高。', tips: '腳跟踩向地面。' },
                { name: '坐姿脊椎旋轉伸展', target: '腰椎靈活', steps: '單腿跨過對側身體旋轉。', tips: '配合吐氣延展。' },
                { name: '肩關節十字交叉', target: '三角肌後束', steps: '單臂橫越胸前輕壓。', tips: '肩膀下沉不聳肩。' },
                { name: '上背穿針引線式', target: '菱形肌伸展', steps: '四足跪姿單手向對側穿出。', tips: '打開上背。' }
            ]
        };

        const weekDays = [
            { id: 'mon', label: '星期一', jsDay: 1 },
            { id: 'tue', label: '星期二', jsDay: 2 },
            { id: 'wed', label: '星期三', jsDay: 3 },
            { id: 'thu', label: '星期四', jsDay: 4 },
            { id: 'fri', label: '星期五', jsDay: 5 },
            { id: 'sat', label: '星期六', jsDay: 6 },
            { id: 'sun', label: '星期日', jsDay: 0 }
        ];

        let currentGoal = 'hypertrophy';
        let customExercises = [];
        let currentSplitCategory = 'chest';
        let weeklyPlan = JSON.parse(localStorage.getItem('weekly_plan') || JSON.stringify({
            mon: 'chest', tue: 'back', wed: 'stretching', thu: 'legs', fri: 'shoulders', sat: 'biceps', sun: 'rest'
        }));

        let activeTimer = null;
        let sessionData = { exercises: [], currentIndex: 0, currentSet: 1, totalSets: 3, timeLeft: 45, isResting: false, isPaused: false, startTime: null };

        document.addEventListener('DOMContentLoaded', () => {
            calculateMetrics();
            updateCustDropdown();
            renderWeekly();
            detectToday();

            // 綁定導覽按鈕
            document.getElementById('tab-gen').addEventListener('click', () => switchView('generator'));
            document.getElementById('tab-week').addEventListener('click', () => switchView('weekly'));
            document.getElementById('tab-cust').addEventListener('click', () => switchView('custom'));
            document.getElementById('tab-hist').addEventListener('click', () => switchView('history'));

            // 目標與啟動
            document.getElementById('goal-hyp').addEventListener('click', () => setGoal('hypertrophy'));
            document.getElementById('goal-fat').addEventListener('click', () => setGoal('fatloss'));
            document.getElementById('btn-launch-today').addEventListener('click', launchToday);
            document.getElementById('btn-generate').addEventListener('click', generateWorkout);
            document.getElementById('btn-reset').addEventListener('click', resetAll);
            document.getElementById('btn-back-setup').addEventListener('click', resetAll);
            document.getElementById('btn-quit').addEventListener('click', quitSession);
            document.getElementById('btn-pause').addEventListener('click', togglePause);
            document.getElementById('btn-skip').addEventListener('click', skipSet);

            document.getElementById('btn-save-weekly').addEventListener('click', saveWeekly);
            document.getElementById('cust-cat').addEventListener('change', updateCustDropdown);
            
            // 綁定「加入自訂清單」按鈕事件
            document.getElementById('btn-add-cust').addEventListener('click', addCustEx);
            document.getElementById('btn-start-cust').addEventListener('click', startCustSession);

            document.getElementById('modal-close').addEventListener('click', closeModal);

            ['input-height', 'input-weight', 'input-age', 'input-gender'].forEach(id => {
                document.getElementById(id).addEventListener('input', calculateMetrics);
            });
        });

        function setGoal(goal) {
            currentGoal = goal;
            document.getElementById('goal-hyp').className = goal === 'hypertrophy' ? 'py-2.5 rounded-xl text-xs font-bold border border-sky-400 bg-sky-400/20 text-sky-400 transition' : 'py-2.5 rounded-xl text-xs font-bold border border-slate-700 bg-slate-900 text-slate-400 transition';
            document.getElementById('goal-fat').className = goal === 'fatloss' ? 'py-2.5 rounded-xl text-xs font-bold border border-sky-400 bg-sky-400/20 text-sky-400 transition' : 'py-2.5 rounded-xl text-xs font-bold border border-slate-700 bg-slate-900 text-slate-400 transition';
        }

        function switchView(viewName) {
            if (activeTimer) {
                if (!confirm("目前正在計時中，確定離開？")) return;
                clearInterval(activeTimer);
                activeTimer = null;
            }
            document.getElementById('view-generator').classList.toggle('hidden', viewName !== 'generator');
            document.getElementById('view-weekly').classList.toggle('hidden', viewName !== 'weekly');
            document.getElementById('view-custom').classList.toggle('hidden', viewName !== 'custom');
            document.getElementById('view-history').classList.toggle('hidden', viewName !== 'history');
            document.getElementById('view-session').classList.add('hidden'); // 離開計時畫面

            document.getElementById('tab-gen').className = viewName === 'generator' ? 'px-2.5 py-1.5 rounded-lg text-xs font-medium bg-sky-400 text-slate-950 transition' : 'px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition';
            document.getElementById('tab-week').className = viewName === 'weekly' ? 'px-2.5 py-1.5 rounded-lg text-xs font-medium bg-sky-400 text-slate-950 transition' : 'px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition';
            document.getElementById('tab-cust').className = viewName === 'custom' ? 'px-2.5 py-1.5 rounded-lg text-xs font-medium bg-sky-400 text-slate-950 transition' : 'px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition';
            document.getElementById('tab-hist').className = viewName === 'history' ? 'px-2.5 py-1.5 rounded-lg text-xs font-medium bg-sky-400 text-slate-950 transition' : 'px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition';

            if (viewName === 'history') renderHistory();
            if (viewName === 'weekly') renderWeekly();
        }

        function calculateMetrics() {
            const h = parseFloat(document.getElementById('input-height').value) || 174;
            const w = parseFloat(document.getElementById('input-weight').value) || 115;
            const a = parseInt(document.getElementById('input-age').value) || 30;
            const gender = document.getElementById('input-gender').value;

            const bmi = (w / Math.pow(h/100, 2)).toFixed(1);
            let bmr = (10 * w) + (6.25 * h) - (5 * a) + (gender === 'male' ? 5 : -161);
            const tdee = Math.round(bmr * 1.375);

            document.getElementById('val-bmi').innerText = bmi;
            document.getElementById('val-bmr').innerText = Math.round(bmr) + ' kcal';
            document.getElementById('val-tdee').innerText = tdee + ' kcal';
        }

        function detectToday() {
            const jsDay = new Date().getDay();
            const dayObj = weekDays.find(d => d.jsDay === jsDay) || weekDays[0];
            const split = weeklyPlan[dayObj.id] || 'rest';
            const names = { chest: '胸部', back: '背部', legs: '腿部', shoulders: '肩部', biceps: '二頭肌', triceps: '三頭肌', abs: '腹肌', stretching: '伸展恢復', fullbody: '全身綜合', rest: '休息日' };
            const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
            document.getElementById('today-date-text').innerText = `今天是 星期${dayNames[jsDay]}`;
            document.getElementById('today-plan-label').innerText = `今日排定：${names[split] || '休息日'}`;
        }

        function launchToday() {
            const jsDay = new Date().getDay();
            const dayObj = weekDays.find(d => d.jsDay === jsDay) || weekDays[0];
            const split = weeklyPlan[dayObj.id] || 'rest';
            if (split === 'rest') {
                alert('今天是休息日！');
                return;
            }
            document.getElementById('input-split').value = split;
            switchView('generator');
            generateWorkout();
        }

        function renderWeekly() {
            const container = document.getElementById('weekly-schedule-list');
            container.innerHTML = '';
            const todayJsDay = new Date().getDay();

            weekDays.forEach(day => {
                const val = weeklyPlan[day.id] || 'rest';
                const isToday = day.jsDay === todayJsDay;
                container.innerHTML += `
                    <div class="bg-slate-900 rounded-xl p-3 border ${isToday ? 'border-sky-400' : 'border-slate-800'} flex justify-between items-center text-xs">
                        <span class="font-bold ${isToday ? 'text-sky-400' : 'text-slate-200'} w-16">${day.label}</span>
                        <select id="w-sel-${day.id}" class="bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white">
                            <option value="chest" ${val==='chest'?'selected':''}>胸部</option>
                            <option value="back" ${val==='back'?'selected':''}>背部</option>
                            <option value="legs" ${val==='legs'?'selected':''}>腿部</option>
                            <option value="shoulders" ${val==='shoulders'?'selected':''}>肩部</option>
                            <option value="biceps" ${val==='biceps'?'selected':''}>二頭肌</option>
                            <option value="triceps" ${val==='triceps'?'selected':''}>三頭肌</option>
                            <option value="abs" ${val==='abs'?'selected':''}>腹肌</option>
                            <option value="stretching" ${val==='stretching'?'selected':''}>伸展</option>
                            <option value="rest" ${val==='rest'?'selected':''}>休息</option>
                        </select>
                        <button type="button" onclick="launchWeekDay('${day.id}')" class="bg-sky-400/20 text-sky-400 px-2.5 py-1 rounded-lg font-bold">開始</button>
                    </div>
                `;
            });
        }

        function saveWeekly() {
            weekDays.forEach(day => {
                weeklyPlan[day.id] = document.getElementById(`w-sel-${day.id}`).value;
            });
            localStorage.setItem('weekly_plan', JSON.stringify(weeklyPlan));
            detectToday();
            alert('✅ 儲存成功！');
        }

        function launchWeekDay(dayId) {
            saveWeekly();
            const split = weeklyPlan[dayId];
            if (split === 'rest') {
                alert('今天是休息日！');
                return;
            }
            document.getElementById('input-split').value = split;
            switchView('generator');
            generateWorkout();
        }

        function updateCustDropdown() {
            const cat = document.getElementById('cust-cat').value;
            const sel = document.getElementById('cust-ex');
            sel.innerHTML = '';
            (db[cat] || []).forEach((item, i) => {
                sel.innerHTML += `<option value="${i}">${item.name} (${item.target})</option>`;
            });
        }

        function addCustEx() {
            if (customExercises.length >= 4) {
                alert('最多4種動作！');
                return;
            }
            const cat = document.getElementById('cust-cat').value;
            const idx = parseInt(document.getElementById('cust-ex').value);
            const item = db[cat][idx];
            if (!item) return;

            customExercises.push({ ...item, sets: 3, duration: 45 });
            renderCustList();
        }

        function renderCustList() {
            const listEl = document.getElementById('cust-list');
            const countEl = document.getElementById('cust-count');
            if (countEl) countEl.innerText = customExercises.length;

            if (customExercises.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">尚未新增動作</p>`;
                document.getElementById('btn-start-cust').disabled = true;
                document.getElementById('btn-start-cust').className = "w-full bg-slate-800 text-slate-500 font-bold py-3 rounded-xl text-sm cursor-not-allowed";
                return;
            }
            listEl.innerHTML = '';
            customExercises.forEach((ex, i) => {
                listEl.innerHTML += `
                    <div class="bg-slate-900 rounded-xl p-2.5 border border-slate-800 flex justify-between items-center text-xs">
                        <div><span class="font-bold text-white">${i+1}. ${ex.name}</span></div>
                        <button type="button" onclick="removeCust(${i})" class="text-rose-400 px-2 py-1"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });
            document.getElementById('btn-start-cust').disabled = false;
            document.getElementById('btn-start-cust').className = "w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl text-sm cursor-pointer";
        }

        function removeCust(i) {
            customExercises.splice(i, 1);
            renderCustList();
        }

        function startCustSession() {
            if (customExercises.length === 0) return;
            sessionData.exercises = [...customExercises];
            sessionData.currentIndex = 0;
            sessionData.currentSet = 1;
            sessionData.totalSets = 3;
            sessionData.timeLeft = 45;
            sessionData.isResting = false;
            sessionData.isPaused = false;
            sessionData.startTime = new Date();

            document.getElementById('view-custom').classList.add('hidden');
            document.getElementById('view-session').classList.remove('hidden');
            updateSessionUI();
            if (activeTimer) clearInterval(activeTimer);
            activeTimer = setInterval(timerTick, 1000);
        }

        function generateWorkout() {
            const split = document.getElementById('input-split').value;
            currentSplitCategory = split;
            let pool = [...(db[split] || db.fullbody)];
            pool.sort(() => Math.random() - 0.5);

            sessionData.exercises = pool.slice(0, 4).map(ex => ({
                ...ex,
                sets: split === 'stretching' ? 2 : (currentGoal === 'hypertrophy' ? 4 : 3),
                duration: split === 'stretching' ? 60 : (currentGoal === 'hypertrophy' ? 50 : 40)
            }));

            document.getElementById('plan-title').innerText = `${currentGoal === 'hypertrophy' ? '💪 增肌' : '🔥 減脂'} - ${split}`;
            renderGenList();

            document.getElementById('setup-card').classList.add('hidden');
            document.getElementById('workout-container').classList.remove('hidden');
        }

        function renderGenList() {
            const listEl = document.getElementById('exercise-list');
            listEl.innerHTML = '';
            sessionData.exercises.forEach((ex, idx) => {
                listEl.innerHTML += `
                    <div class="bg-slate-900 rounded-xl p-3.5 border border-slate-800 flex justify-between items-center">
                        <div>
                            <span class="text-[10px] bg-sky-400/20 text-sky-400 px-2 py-0.5 rounded font-medium">動作 ${idx + 1}</span>
                            <h4 class="text-sm font-bold text-white mt-1">${ex.name}</h4>
                            <p class="text-xs text-slate-400">${ex.target} | ${ex.sets}組 x ${ex.duration}秒</p>
                        </div>
                        <div class="flex space-x-1.5">
                            <button type="button" onclick="swapEx(${idx})" class="bg-slate-800 text-sky-400 text-xs px-2.5 py-1.5 rounded-lg">更換</button>
                            <button type="button" onclick="openModal('${ex.name}', '${ex.steps}', '${ex.tips}')" class="bg-slate-800 text-slate-300 text-xs px-2.5 py-1.5 rounded-lg"><i class="fa-brands fa-youtube text-rose-500"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        function swapEx(idx) {
            const pool = db[currentSplitCategory] || [];
            const currentNames = sessionData.exercises.map(e => e.name);
            const avail = pool.filter(e => !currentNames.includes(e.name));
            if (avail.length === 0) {
                alert('沒有更多備選動作！');
                return;
            }
            const newEx = avail[Math.floor(Math.random() * avail.length)];
            sessionData.exercises[idx] = {
                ...newEx,
                sets: currentSplitCategory === 'stretching' ? 2 : (currentGoal === 'hypertrophy' ? 4 : 3),
                duration: currentSplitCategory === 'stretching' ? 60 : (currentGoal === 'hypertrophy' ? 50 : 40)
            };
            renderGenList();
        }

        function resetAll() {
            document.getElementById('setup-card').classList.remove('hidden');
            document.getElementById('workout-container').classList.add('hidden');
            document.getElementById('view-session').classList.add('hidden');
        }

        function openModal(name, steps, tips) {
            document.getElementById('modal-title').innerText = name;
            document.getElementById('modal-steps').innerText = steps;
            document.getElementById('modal-tips').innerText = tips;
            document.getElementById('modal-yt').href = `https://www.youtube.com/results?search_query=${encodeURIComponent(name + ' 標準動作教學')}`;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function startSession() {
            sessionData.currentIndex = 0;
            sessionData.currentSet = 1;
            sessionData.totalSets = sessionData.exercises[0].sets;
            sessionData.timeLeft = sessionData.exercises[0].duration;
            sessionData.isResting = false;
            sessionData.isPaused = false;
            sessionData.startTime = new Date();

            document.getElementById('workout-container').classList.add('hidden');
            document.getElementById('view-session').classList.remove('hidden');
            updateSessionUI();
            if (activeTimer) clearInterval(activeTimer);
            activeTimer = setInterval(timerTick, 1000);
        }

        function updateSessionUI() {
            const ex = sessionData.exercises[sessionData.currentIndex];
            document.getElementById('session-progress-text').innerText = `動作 ${sessionData.currentIndex + 1} / ${sessionData.exercises.length}`;
            document.getElementById('active-ex-name').innerText = ex.name;
            document.getElementById('active-ex-target').innerText = `目標：${ex.target}`;
            document.getElementById('active-yt-link').href = `https://www.youtube.com/results?search_query=${encodeURIComponent(ex.name + ' 標準動作教學')}`;

            document.getElementById('timer-label').innerText = sessionData.isResting ? "組間休息" : "訓練進行中";
            document.getElementById('timer-sets-info').innerText = sessionData.isResting ? `準備第 ${sessionData.currentSet} 組` : `第 ${sessionData.currentSet} 組 / 共 ${sessionData.totalSets} 組`;

            const m = Math.floor(sessionData.timeLeft / 60).toString().padStart(2, '0');
            const s = (sessionData.timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').innerText = `${m}:${s}`;
        }

        function timerTick() {
            if (sessionData.isPaused) return;
            if (sessionData.timeLeft > 0) {
                sessionData.timeLeft--;
                updateSessionUI();
            } else {
                if (!sessionData.isResting) {
                    if (sessionData.currentSet < sessionData.totalSets) {
                        sessionData.isResting = true;
                        sessionData.timeLeft = currentSplitCategory === 'stretching' ? 15 : (currentGoal === 'hypertrophy' ? 45 : 25);
                    } else {
                        sessionData.currentIndex++;
                        if (sessionData.currentIndex < sessionData.exercises.length) {
                            sessionData.currentSet = 1;
                            sessionData.totalSets = sessionData.exercises[sessionData.currentIndex].sets;
                            sessionData.isResting = false;
                            sessionData.timeLeft = sessionData.exercises[sessionData.currentIndex].duration;
                        } else {
                            finishSession();
                            return;
                        }
                    }
                } else {
                    sessionData.isResting = false;
                    sessionData.currentSet++;
                    sessionData.timeLeft = sessionData.exercises[sessionData.currentIndex].duration;
                }
                updateSessionUI();
            }
        }

        function skipSet() {
            sessionData.timeLeft = 0;
            timerTick();
        }

        function togglePause() {
            sessionData.isPaused = !sessionData.isPaused;
            document.getElementById('btn-pause').innerText = sessionData.isPaused ? '繼續' : '暫停';
        }

        function quitSession() {
            if (confirm("確定放棄目前訓練？")) {
                clearInterval(activeTimer);
                activeTimer = null;
                document.getElementById('view-session').classList.add('hidden');
                document.getElementById('view-custom').classList.remove('hidden');
            }
        }

        function finishSession() {
            clearInterval(activeTimer);
            activeTimer = null;
            const durMin = Math.round((new Date() - sessionData.startTime) / 60000) || 1;
            const cals = durMin * 9;

            let history = JSON.parse(localStorage.getItem('workout_history') || '[]');
            history.unshift({ date: new Date().toLocaleString(), mode: '健身訓練', duration: durMin, calories: cals });
            localStorage.setItem('workout_history', JSON.stringify(history));

            alert(`🎉 恭喜完成訓練！耗時 ${durMin} 分鐘，消耗約 ${cals} kcal`);
            document.getElementById('view-session').classList.add('hidden');
            document.getElementById('view-generator').classList.remove('hidden');
            resetAll();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            const history = JSON.parse(localStorage.getItem('workout_history') || '[]');
            if (history.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">尚無訓練紀錄</p>`;
                return;
            }
            list.innerHTML = '';
            history.forEach(item => {
                list.innerHTML += `
                    <div class="bg-slate-900 rounded-xl p-3 border border-slate-800 flex justify-between items-center text-xs">
                        <div><span class="text-sky-400 font-semibold">${item.mode}</span><p class="text-slate-400">${item.date}</p></div>
                        <div class="text-right"><span class="text-white font-bold">${item.duration} 分鐘</span><p class="text-slate-400">約 ${item.calories} kcal</p></div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
